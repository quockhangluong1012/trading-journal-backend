services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Container ships sqlcmd under /opt/mssql-tools18 (note -C to trust the dev cert).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # In Development the app auto-applies EF migrations on startup for most modules.
      ConnectionStrings__TradeDatabase: "Server=db,1433;Database=TradingJournal;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__BacktestDatabase: "Server=db,1433;Database=TradingJournalBacktest;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;Encrypt=False"
      # Replace these dev placeholders for any non-local use.
      Jwt__Secret: "local-dev-only-secret-key-change-me-at-least-32-bytes"

volumes:
  mssql-data:
